aid: ground
name: Ground
description: Ground News is a news aggregation platform, built by Snapwise Inc. and backed by Techstars,
  that helps readers see every side of every story. It gathers coverage of each news event from across
  the political spectrum and pairs every story with media bias ratings, factuality assessments, and
  source-ownership transparency. Signature features include the Blindspot Feed that surfaces stories
  disproportionately covered by the left or right, a per-story bias-distribution bar, local news
  customization, daily briefing newsletters, browser extensions, and iOS/Android apps. Ground News does
  not currently publish a public developer API, developer portal, or API documentation, and its one live
  machine surface, api.ground.news, is the private backend of its own apps. The single integration point
  it does publish is an unauthenticated embeddable iframe story widget. This profile captures that widget,
  the company's public web and commercial surface, the contract-discovery probe record, and its
  domain-security posture.
