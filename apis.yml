    "I'm a Teapot" to every path including the root, while developer., developers.,
    docs., status. and trust.ground.news do not resolve at all and every well-known,
    OpenAPI and agent-card path on the four hosts it does serve returns 404 — the only
    third-party integration point it publishes is a single unauthenticated iframe story
    widget.
