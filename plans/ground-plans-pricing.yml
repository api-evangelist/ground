description: >-
  Ground News sells a consumer news subscription, not API access. These are the tiers a
  reader can buy on the public pricing page; none of them includes, meters or mentions
  an API, and there is no developer or data plan of any kind. Recorded here so the
  commercial surface is captured honestly — api_access_included is false on every tier.
  The page currently renders a single-plan variant: its own page state declares
  availablePlans ["vantage"] under the feature flag "vantage-only-plan", so the
  historical multi-tier layout is being A/B-tested away and only Vantage is offered to
  an anonymous visitor from this probe's location. A free, no-account reading tier
  exists in practice — the site, the top-stories feed and the widget all render without
  login — but it is not itemised or priced on the page, so it is recorded as
  unpriced rather than assigned a price it does not publish.
