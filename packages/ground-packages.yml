name: Ground News client libraries and packages
description: >-
  Ground News publishes no first-party client library in any package registry, and has
  no GitHub organisation. This follows directly from having no public API: there is no
  contract for an SDK to wrap. official_count and package_count are both honest zeros,
  and NO SDKs pointer is emitted in apis.yml — an SDKs pointer would assert client
  libraries that do not exist. Ground News does ship first-party software (iOS and
  Android apps, and a bias-checker browser extension for Chrome, Firefox and Edge), but
  those are end-user applications distributed through app stores, not developer
  packages; they are recorded in components/ground-components.yml under not_components
  so they cannot be miscounted as an SDK surface.
